# Turns a Duplex (Twee) story into an Android app.
#
# Your story repo calls this with a short workflow of its own; see
# android-app/APP-GUIDE.md for the copy-and-paste file and every option.
name: Story app (reusable)

on:
  workflow_call:
    inputs:
      app_name:
        description: Name shown under the app icon, e.g. "Journey Into The Astralscapes".
        type: string
        required: true
      app_id:
        description: Unique app ID, e.g. io.github.yourname.mystory. Never change it after you install the app.
        type: string
        required: true
      story_path:
        description: File or folder Tweego compiles (relative to your repo).
        type: string
        default: "."
      assets_path:
        description: Optional folder of images/audio, copied next to the story so relative links work.
        type: string
        default: ""
      icon:
        description: Optional square PNG (512x512 is ideal) to use as the app icon.
        type: string
        default: ""
      format_id:
        description: Tweego story format ID. Leave as duplex-1 for Duplex stories.
        type: string
        default: duplex-1
      version_prefix:
        description: First part of the version name; the build number is added after it.
        type: string
        default: "1.0"
      duplex_ref:
        description: Branch or tag of duplex-story-format to take the format and app template from.
        type: string
        default: main
      release:
        description: Publish the APK on your repo's Releases page (on pushes and manual runs).
        type: boolean
        default: true
    secrets:
      STORY_KEYSTORE_BASE64:
        required: false
      STORY_KEYSTORE_PASSWORD:
        required: false
      STORY_KEY_ALIAS:
        required: false
      STORY_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_DIR: duplex/android-app
    steps:
      - name: Check out your story
        uses: actions/checkout@v4
        with:
          path: story

      - name: Check out Duplex and the app template
        uses: actions/checkout@v4
        with:
          repository: Techy-Nature/duplex-story-format
          ref: ${{ inputs.duplex_ref }}
          path: duplex

      - name: Install Tweego
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tweego.zip" \
            https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-linux-x64.zip
          mkdir -p "$RUNNER_TEMP/tweego" "$RUNNER_TEMP/storyformats/duplex-1"
          unzip -q "$RUNNER_TEMP/tweego.zip" -d "$RUNNER_TEMP/tweego"
          chmod +x "$RUNNER_TEMP/tweego/tweego"
          cp "duplex/Duplex-1/duplex-format/format.js" "$RUNNER_TEMP/storyformats/duplex-1/"
          echo "$RUNNER_TEMP/tweego" >> "$GITHUB_PATH"
          echo "TWEEGO_PATH=$RUNNER_TEMP/storyformats" >> "$GITHUB_ENV"

      - name: Compile the story into the app
        env:
          STORY_PATH: ${{ inputs.story_path }}
          ASSETS_PATH: ${{ inputs.assets_path }}
          FORMAT_ID: ${{ inputs.format_id }}
          ICON: ${{ inputs.icon }}
        run: |
          set -euo pipefail
          out="$APP_DIR/app/src/main/assets/story"
          mkdir -p "$out"
          format_args=()
          if [ -n "$FORMAT_ID" ]; then format_args=(-f "$FORMAT_ID"); fi
          tweego "${format_args[@]}" -o "$out/index.html" "story/$STORY_PATH"
          echo "Compiled story: $(du -h "$out/index.html" | cut -f1)"
          if [ -n "$ASSETS_PATH" ]; then
            if [ ! -d "story/$ASSETS_PATH" ]; then
              echo "::error::assets_path '$ASSETS_PATH' is not a folder in your repo."; exit 1
            fi
            cp -R "story/$ASSETS_PATH/." "$out/"
            echo "Copied assets from $ASSETS_PATH"
          fi
          if [ -n "$ICON" ]; then
            if [ ! -f "story/$ICON" ]; then
              echo "::error::icon '$ICON' was not found in your repo."; exit 1
            fi
            mkdir -p "$APP_DIR/app/src/main/res/drawable-nodpi"
            cp "story/$ICON" "$APP_DIR/app/src/main/res/drawable-nodpi/ic_story_icon.png"
            echo "Using custom icon $ICON"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use your private signing key if one is set up (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.STORY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/story.keystore"
            echo "STORY_KEYSTORE_FILE=$RUNNER_TEMP/story.keystore" >> "$GITHUB_ENV"
            echo "Signing with your private key from repository secrets."
          else
            echo "No private key set; signing with the bundled public key."
          fi

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}
        env:
          STORY_APP_NAME: ${{ inputs.app_name }}
          STORY_APP_ID: ${{ inputs.app_id }}
          STORY_VERSION_PREFIX: ${{ inputs.version_prefix }}
          STORY_KEYSTORE_PASSWORD: ${{ secrets.STORY_KEYSTORE_PASSWORD }}
          STORY_KEY_ALIAS: ${{ secrets.STORY_KEY_ALIAS }}
          STORY_KEY_PASSWORD: ${{ secrets.STORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          file_name="$(echo "$STORY_APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-*//; s/-*$//')"
          [ -n "$file_name" ] || file_name="Story"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$file_name.apk"
          echo "APK_FILE=$file_name.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: story-apk
          path: ${{ env.APK_FILE }}

      - name: Publish release
        if: inputs.release && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ inputs.version_prefix }}.${{ github.run_number }}
          name: ${{ inputs.app_name }} ${{ inputs.version_prefix }}.${{ github.run_number }}
          body: |
            Tap **${{ env.APK_FILE }}** below to download it on your phone, then open it to install or update.
          files: ${{ env.APK_FILE }}
          make_latest: "true"
