# Forgejo version (for git.gay and other Forgejo servers).
# Copy this file into your story repo as .forgejo/workflows/app.yml
# Every push to main builds a new APK and puts it on your Releases page.
#
# Change the four lines under "env:" to fit your story, and change "runs-on"
# to a label shown on your runner page (Settings → Actions → Runners).
name: Build story app

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: Journey Into The Astralscapes
  APP_ID: io.github.techynature.astralscapes
  STORY_PATH: src          # file or folder Tweego compiles
  ASSETS_PATH: ""          # optional folder of images/audio, e.g. media
  ICON: ""                 # optional square PNG, e.g. media/icon.png
  VERSION_PREFIX: "1.0"
  DUPLEX_REF: main

jobs:
  app:
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - name: Check out your story
        uses: actions/checkout@v4
        with:
          path: story

      - name: Install Java and tools
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless unzip curl git > /dev/null
          java -version

      - name: Get Duplex and the app template
        run: git clone --depth 1 -b "$DUPLEX_REF" https://github.com/Techy-Nature/duplex-story-format.git duplex

      - name: Install Tweego
        run: |
          curl -fsSL -o /tmp/tweego.zip \
            https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-linux-x64.zip
          mkdir -p /opt/tweego /opt/storyformats/duplex-1
          unzip -q /tmp/tweego.zip -d /opt/tweego
          chmod +x /opt/tweego/tweego
          cp "duplex/Duplex 1.5.0/duplex-format/format.js" /opt/storyformats/duplex-1/

      - name: Compile the story into the app
        shell: bash
        run: |
          set -euo pipefail
          export TWEEGO_PATH=/opt/storyformats
          out="duplex/android-app/app/src/main/assets/story"
          mkdir -p "$out"
          /opt/tweego/tweego -f duplex-1 -o "$out/index.html" "story/$STORY_PATH"
          echo "Compiled story: $(du -h "$out/index.html" | cut -f1)"
          if [ -n "$ASSETS_PATH" ]; then
            [ -d "story/$ASSETS_PATH" ] || { echo "ASSETS_PATH '$ASSETS_PATH' is not a folder in your repo."; exit 1; }
            cp -R "story/$ASSETS_PATH/." "$out/"
          fi
          if [ -n "$ICON" ]; then
            [ -f "story/$ICON" ] || { echo "ICON '$ICON' was not found in your repo."; exit 1; }
            mkdir -p duplex/android-app/app/src/main/res/drawable-nodpi
            cp "story/$ICON" duplex/android-app/app/src/main/res/drawable-nodpi/ic_story_icon.png
          fi

      - name: Install the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/opt/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > duplex/android-app/local.properties

      - name: Build the APK
        shell: bash
        env:
          STORY_APP_NAME: ${{ env.APP_NAME }}
          STORY_APP_ID: ${{ env.APP_ID }}
          STORY_VERSION_PREFIX: ${{ env.VERSION_PREFIX }}
          STORY_BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.STORY_KEYSTORE_BASE64 }}
          STORY_KEYSTORE_PASSWORD: ${{ secrets.STORY_KEYSTORE_PASSWORD }}
          STORY_KEY_ALIAS: ${{ secrets.STORY_KEY_ALIAS }}
          STORY_KEY_PASSWORD: ${{ secrets.STORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/story.keystore
            export STORY_KEYSTORE_FILE=/tmp/story.keystore
            echo "Signing with your private key from repository secrets."
          else
            echo "No private key set; signing with the bundled public key."
          fi
          cd duplex/android-app
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          name="$(echo "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-*//; s/-*$//')"
          [ -n "$name" ] || name="Story"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/$name.apk"
          echo "APK_FILE=$name.apk" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: app-v${{ env.VERSION_PREFIX }}.${{ github.run_number }}
        run: |
          set -euo pipefail
          body=$(node -e 'console.log(JSON.stringify({
            tag_name: process.env.TAG,
            target_commitish: process.env.GITHUB_SHA,
            name: process.env.APP_NAME + " " + process.env.TAG.slice(5),
            body: "Tap **" + process.env.APK_FILE + "** below to download it on your phone, then open it to install or update."
          }))')
          release_id=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
          curl -fsS -X POST "$API/releases/$release_id/assets?name=$APK_FILE" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@dist/$APK_FILE" > /dev/null
          echo "Published $TAG with $APK_FILE"
