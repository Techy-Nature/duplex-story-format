<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{STORY_NAME}}</title>
  <style>
    :root { color-scheme: dark; --duplex-accent:#83c5be; --duplex-bg:#17191d; --duplex-panel:#22252b; --duplex-text:#f1f3f5; --duplex-muted:#aeb5bd; --duplex-bar-width:17rem; --duplex-bar-stowed:3.25rem; --duplex-left-space:var(--duplex-bar-width); --duplex-right-space:var(--duplex-bar-width); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--duplex-bg); color:var(--duplex-text); font:18px/1.65 system-ui,sans-serif; }
    #duplex-shell { width:min(48rem,calc(100% - 2rem)); margin:0 auto; padding:3rem 0 7rem; transform:translateX(calc((var(--duplex-left-space) - var(--duplex-right-space))/2)); transition:transform .2s ease; }
    .duplex-ui-bar { position:fixed; z-index:20; inset-block:0; width:var(--duplex-bar-width); padding:1rem; overflow:auto; background:var(--duplex-panel); border-color:#ffffff20; transition:width .2s ease,transform .2s ease; }
    .duplex-ui-bar[data-side="left"] { left:0; border-right:1px solid; }
    .duplex-ui-bar[data-side="right"] { right:0; border-left:1px solid; }
    .duplex-ui-bar.is-hidden { visibility:hidden; }
    .duplex-ui-bar.is-stowed { width:var(--duplex-bar-stowed); overflow:hidden; }
    .duplex-ui-bar.is-stowed .duplex-bar-body { display:none; }
    .duplex-bar-toggle { position:sticky; top:0; float:right; width:2.25rem; padding:.35rem; }
    .duplex-ui-bar[data-side="right"] .duplex-bar-toggle { float:left; }
    .duplex-bar-title { margin:.2rem 0 1.5rem; font-size:1.2rem; }
    .duplex-bar-section { margin:1rem 0; padding-top:1rem; border-top:1px solid #ffffff20; }
    .duplex-bar-actions { display:grid; gap:.5rem; }
    .duplex-bar-actions button { width:100%; }
    #duplex-dialog { width:min(34rem,calc(100% - 2rem)); color:var(--duplex-text); background:var(--duplex-panel); border:1px solid #ffffff30; border-radius:.75rem; padding:0; }
    #duplex-dialog::backdrop { background:#000a; }
    #duplex-dialog-body { padding:1.5rem; }
    #duplex-dialog-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.5rem; padding:1rem 1.5rem; border-top:1px solid #ffffff20; }
    button,.duplex-link { color:var(--duplex-accent); cursor:pointer; }
    button { border:1px solid color-mix(in srgb,var(--duplex-accent) 50%,transparent); border-radius:.5rem; background:var(--duplex-panel); padding:.55rem .8rem; font:inherit; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .duplex-inventory-list { display:grid; gap:.5rem; margin:1rem 0; padding:0; list-style:none; }
    .duplex-bag-row { display:flex; align-items:center; gap:.75rem; width:100%; text-align:left; }
    .duplex-bag-row .duplex-bag-name { flex:1; }
    .duplex-passage { padding:1.75rem 0; animation:duplex-in .18s ease-out; }
    .duplex-passage + .duplex-passage { border-top:1px solid #ffffff20; }
    .duplex-passage-title { margin:0 0 1rem; font-size:1.15rem; color:var(--duplex-muted); }
    .duplex-error { border-left:.25rem solid #ef476f; padding:.7rem 1rem; background:#ef476f18; }
    tw-storydata { display:none; }
    @keyframes duplex-in { from { opacity:0; transform:translateY(.25rem); } }
    @media (max-width:1100px) { :root { --duplex-left-space:var(--duplex-bar-stowed); --duplex-right-space:var(--duplex-bar-stowed); } .duplex-ui-bar:not(.is-stowed) { box-shadow:0 0 2rem #0008; } }
    @media (max-width:650px) { #duplex-shell { width:min(100% - 5rem,48rem); } }
    @media (prefers-reduced-motion:reduce) { .duplex-passage { animation:none; } }
  </style>
</head>
<body>
  <aside id="ui-bar" class="duplex-ui-bar" data-side="left" aria-label="Left story bar">
    <button class="duplex-bar-toggle" type="button" aria-label="Toggle left bar">☰</button>
    <div class="duplex-bar-body">
      <h1 id="duplex-story-title" class="duplex-bar-title">{{STORY_NAME}}</h1>
      <div id="story-caption" class="duplex-bar-section"></div>
      <nav id="story-menu" class="duplex-bar-section" aria-label="Story menu"></nav>
      <div id="story-left-bar" class="duplex-bar-section"></div>
      <div class="duplex-bar-actions duplex-bar-section">

        <button id="duplex-restart" type="button">Restart</button>
        <button id="duplex-saves" type="button">Saves</button>
        <button id="duplex-settings" type="button">Settings</button>
      </div>
    </div>
  </aside>
  <main id="duplex-shell"><div id="duplex-passages" aria-live="polite"></div></main>
  <aside id="ui-bar-right" class="duplex-ui-bar" data-side="right" aria-label="Right story bar">
    <button class="duplex-bar-toggle" type="button" aria-label="Toggle right bar">☰</button>
    <div class="duplex-bar-body">
      <h2 class="duplex-bar-title">Story</h2>
      <div class="duplex-bar-section"><strong>Passage</strong><div id="duplex-current-passage">—</div></div>
      <div class="duplex-bar-section"><strong>Display</strong><div id="duplex-current-mode">—</div></div>
      <div class="duplex-bar-section"><strong>Inventory</strong><div id="duplex-inventory-summary">0 bags</div></div>
      <div id="story-right-bar" class="duplex-bar-section"></div>
    </div>
  </aside>
  <dialog id="duplex-dialog"><div id="duplex-dialog-body"></div><div id="duplex-dialog-actions"></div></dialog>
  {{STORY_DATA}}

    window.Duplex={go,back:()=>document.querySelector('#duplex-back').click(),restart,mode,tags,hasTag,audio:AudioEngine,UI,Save,UIBarL,UIBarR,widgets};
    if(window.matchMedia?.('(max-width:1100px)').matches){UIBarL.stow(true);UIBarR.stow(true);}
    data.querySelectorAll('script[type="text/twine-javascript"]').forEach(source => {
      try { (0, eval)(source.textContent); } catch (error) { console.error('Story JavaScript:', error); }
    });
    defineWidgets();
    runInit(); Object.assign(initial,clone(State.variables)); go(startTitle());
  })();
  </script>
